type: object
required:
  - artifact_id
  - name
  - kdd_stage
  - owner
  - source
  - created_at
properties:
  artifact_id:
    type: string
  name:
    type: string
  kdd_stage:
    type: string
    enum:
      - selection
      - preprocessing
      - transformation
      - data_mining
      - interpretation
      - documentation
      - deployment
  owner:
    type: string
  source:
    type: string
  related_repository:
    type: string
  evidence:
    type: array
    items:
      type: string
  approval_required:
    type: boolean
