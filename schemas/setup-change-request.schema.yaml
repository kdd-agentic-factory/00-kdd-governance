type: object
required:
  - request_id
  - session_id
  - change_type
  - risk_level
  - evidence
  - approval_required
properties:
  request_id:
    type: string
  session_id:
    type: string
  change_type:
    type: string
    enum:
      - chassis
      - suspension
      - braking
      - electronics
      - tires
      - aero_parts
  risk_level:
    type: string
    enum:
      - low
      - medium
      - high
      - critical
  evidence:
    type: array
    items:
      type: string
  approval_required:
    type: boolean
