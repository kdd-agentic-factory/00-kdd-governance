type: object
required:
  - action_id
  - agent_id
  - action_type
  - risk_level
  - evidence
  - timestamp
properties:
  action_id:
    type: string
  agent_id:
    type: string
  action_type:
    type: string
  risk_level:
    enum: [low, medium, high, critical]
  evidence:
    type: array
    items:
      type: string
  timestamp:
    type: string

